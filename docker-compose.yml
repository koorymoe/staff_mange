services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: staffmange
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: staffmange
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffmange"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-go
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://staffmange:${DB_PASSWORD}@db:5432/staffmange?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DAILY_CAP: ${GEMINI_DAILY_CAP:-300}
      # 👂 أذن كمال: مزوّدات تحويل الصوت (الأساسي AI_IRIS_VOICE=gemini|deepgram|soniox)
      GEMINI_STT_MODEL: ${GEMINI_STT_MODEL:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      SONIOX_MODEL: ${SONIOX_MODEL:-}
      AI_VOICE_POLISH: ${AI_VOICE_POLISH:-1}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-}
      # ماتركس: نموذج Anthropic (اختياري). بلا مفتاح يبقى على القواعد.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 🧠 دماغين (10-28): داخلي = ماتركس + ايريس، خارجي = الجودة + الحجوزات
      AI_KEY_INTERNAL: ${AI_KEY_INTERNAL:-}
      AI_KEY_EXTERNAL: ${AI_KEY_EXTERNAL:-}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-}
      AI_INTERNAL_DAILY_USD: ${AI_INTERNAL_DAILY_USD:-2}
      AI_EXTERNAL_DAILY_USD: ${AI_EXTERNAL_DAILY_USD:-1}
      AI_KEY_MATRIX: ${AI_KEY_MATRIX:-}
      AI_KEY_SECRETARY: ${AI_KEY_SECRETARY:-}
      AI_KEY_QUALITY: ${AI_KEY_QUALITY:-}
      AI_KEY_BOOKING: ${AI_KEY_BOOKING:-}
      AI_MODEL_SECRETARY: ${AI_MODEL_SECRETARY:-}
      AI_SECRETARY_DAILY_CAP: ${AI_SECRETARY_DAILY_CAP:-300}
      AI_IRIS_WEB_SEARCH: ${AI_IRIS_WEB_SEARCH:-true}
      AI_IRIS_VOICE: ${AI_IRIS_VOICE:-gemini}
      AI_MATRIX_DAILY_USD: ${AI_MATRIX_DAILY_USD:-0.5}
      AI_IRIS_DAILY_USD: ${AI_IRIS_DAILY_USD:-0.5}
      AI_QUALITY_DAILY_USD: ${AI_QUALITY_DAILY_USD:-0.2}
      AI_BOOKING_DAILY_USD: ${AI_BOOKING_DAILY_USD:-0.2}
      # بوت بلاغات الموظفين (تلغرام) — بلا الرمز البوت مطفي
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      BOT_READER_TOKEN: ${BOT_READER_TOKEN:-}
      REMOTE_HOURS_AGENT_TOKEN: ${REMOTE_HOURS_AGENT_TOKEN:-}
      REMOTE_HOURS_AGENT_EMPLOYEE: ${REMOTE_HOURS_AGENT_EMPLOYEE:-}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_ID: ${WA_PHONE_ID:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      WA_TEMPLATE_QUALITY: ${WA_TEMPLATE_QUALITY:-}
      WA_TEMPLATE_BOOKING: ${WA_TEMPLATE_BOOKING:-}
      WA_TEMPLATE_LANG: ${WA_TEMPLATE_LANG:-ar}
      WA_DAILY_NEW: ${WA_DAILY_NEW:-10}
      WA_PRIVACY_APPROVED: ${WA_PRIVACY_APPROVED:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      # (ع) 10-14: إيميلات رموز التحقق لتطبيق الزبائن (Gmail + App Password)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-200}
      # ماتركس يسمع الفويس: تحويل الصوت لنص بحاوية whisper الداخلية (الصوت ما يطلع).
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8080}
      TUTORIALS_DIR: /app/tutorials
      # مجلد رفع الملفات — لازم يكون فوليوم دائم، مو داخل الصورة، وإلا
      # كل الصور والوصولات تروح مع أول إعادة نشر.
      UPLOADS_DIR: /app/uploads
      # بيانات دخول حساب المالك — تنقرأ من .env بالسيرفر فقط، أبداً من الكود.
      OWNER_USERNAME: ${OWNER_USERNAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    volumes:
      # المساعد الذكي يقرأ أدلة الاستخدام (tutorial-*.html و guide-*.txt) وقت التشغيل
      # حتى يشرح للموظفين شلون يستخدمون النظام — bind-mount بدل نسخها بالصورة حتى
      # نقدر نحدّث محتوى الأدلة بدون إعادة بناء صورة الباك اند.
      - ./tutorials:/app/tutorials:ro
      # الملفات المرفوعة (صور المنتجات، الوصولات، وثائق السيارات)
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══ تحويل الصوت لنص — داخل السيرفر ═══
  # بلا ports: يوصله الباك اند بس على الشبكة الداخلية. الحجم: WHISPER_MODEL
  # (small افتراضي ~١GB رام، base أخف). إذا ما اشتغل، الفويس يبقى محفوظ بلا تحليل.
  whisper:
    build:
      context: ./whisper
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    restart: unless-stopped
    mem_limit: ${WHISPER_MEM_LIMIT:-1500m}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
    restart: unless-stopped
    depends_on:
      backend:
        # service_healthy مو مجرد service started — لازم /api/health يرد فعلاً
        # قبل ما فرونت إند/كادي يعتمدون على الباك إند شغّال، مو بس الحاوية بدأت.
        condition: service_healthy
    # ملاحظة أمنية: نربط المنفذ بالعنوان المحلي فقط. قبل، "8081:80" جان
    # يفتحه على كل الواجهات — يعني ممكن الوصول للنظام مباشرةً بـHTTP بلا
    # تشفير، متجاوزاً Caddy وHTTPS. الوصول الخارجي يجي عبر Caddy حصراً.
    ports:
      - "127.0.0.1:8081:80"

  # (ع) 10-14: تطبيق الزبائن — واجهة مستقلة على دومينها (CUSTOMER_DOMAIN)
  customer:
    build:
      context: ./customer-app
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN_CUSTOMER:-}
    restart: unless-stopped
    # معاينة قبل الدومين: http://IP-السيرفر:8082 (يكدر ينشال بعد ما يتوجّه الدومين)
    ports:
      - "${CUSTOMER_PREVIEW_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy

  # عكس-وكيل (reverse proxy) بشهادة أمان تلقائية مجانية (HTTPS) عن طريق
  # الدومين — Caddy يجدد الشهادة تلقائياً بدون أي تدخل يدوي (بخلاف certbot).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - customer
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN:-customer.localhost}
      # أدوات المراقبة (/ops/*) — باسورد bcrypt. بالـ .env حطه بين علامتي ' ' (بيه $).
      OPS_USER: ${OPS_USER:-ops}
      # الافتراضي هاش لباسورد عشوائي محد يعرفه (= مقفول). ($$ = $ بالـ compose)
      OPS_PASS_HASH: ${OPS_PASS_HASH:-$$2a$$12$$0IBree/3uN4GClDVo7E.e.Ccv0fzrjFdA0KImBgVjEhA4VzkiiX9G}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  # ═══ أدوات المراقبة (دازاي 11-05) — من خلال caddy بس (/ops/*) وبباسورد ═══
  # ⚠️ السيرفر ذاكرته ٣.٨ گيگا: كل أداة إلها سقف ذاكرة حتى ما توگّع النظام.
  # Dozzle: يعرض سجلات الحاويات بالمتصفح (قراءة بس).
  dozzle:
    image: amir20/dozzle:v11.3.4
    restart: unless-stopped
    environment:
      DOZZLE_BASE: /ops/logs
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 96m
    profiles: ["ops"]

  # Netdata: الذاكرة والمعالج والقرص لحظة بلحظة، وتنبيهات إذا قربت تخلص.
  netdata:
    image: netdata/netdata:v2.12.1
    restart: unless-stopped
    hostname: staffmanage
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      DO_NOT_TRACK: "1"
      NETDATA_DISABLE_CLOUD: "1"
    volumes:
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 320m
    profiles: ["ops"]

volumes:
  netdata_lib:
  netdata_cache:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
