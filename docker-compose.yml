services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: staffmange
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: staffmange
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffmange"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-go
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://staffmange:${DB_PASSWORD}@db:5432/staffmange?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
