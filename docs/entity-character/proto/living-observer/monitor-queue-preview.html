<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>طابور المراقبين اليومي</title>
  <style>
    :root{font-family:"Segoe UI",Tahoma,sans-serif;color:#17233c;background:#edf3fb;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px;background:linear-gradient(145deg,#edf4fd,#dce8f8)}button{font:inherit;cursor:pointer}.shell{width:min(1320px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px}.top h1{font-size:1.55rem;margin:0}.top p{margin:5px 0;color:#697994}.time{padding:9px 13px;border:1px solid #cbd9ea;border-radius:999px;background:#fff;font-weight:800;color:#175fae}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}.queue,.report{border:1px solid #d8e3f1;border-radius:22px;background:#fff;box-shadow:0 18px 45px #31547512}.queue{padding:18px}.queue-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.queue h2,.report h2{font-size:1.05rem;margin:0}.count{font-size:.76rem;color:#5b6d89;background:#edf5ff;border-radius:999px;padding:5px 9px}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.filters button{border:1px solid #d5e1f0;background:#fff;color:#59708f;padding:7px 10px;border-radius:999px;font-size:.75rem}.filters button.active{background:#096ccb;color:#fff;border-color:#096ccb}.cards{display:grid;gap:10px}.monitor{display:grid;grid-template-columns:55px 1fr auto;align-items:center;gap:11px;padding:11px;border:1px solid #e0e8f3;border-radius:16px;background:#fff;text-align:right;transition:.18s}.monitor:hover,.monitor.active{border-color:#3d95e9;background:#f6fbff;box-shadow:0 8px 20px #1665aa12}.avatar{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(140deg,#0b72d6,#032b70);box-shadow:inset 0 0 0 3px #e6f3ff}.avatar.amber{background:linear-gradient(140deg,#ec9b2b,#a94b16)}.avatar.purple{background:linear-gradient(140deg,#8b5cf6,#452092)}.avatar.green{background:linear-gradient(140deg,#20b87c,#056747)}.who b{display:block;font-size:.92rem}.who span{display:block;color:#76869f;font-size:.75rem;margin-top:3px}.fact{color:#536780;font-size:.74rem;margin-top:4px}.badge{font-size:.71rem;font-weight:900;padding:6px 8px;border-radius:999px;white-space:nowrap}.warn{background:#fff4d9;color:#a45b00}.deduct{background:#fee6e8;color:#be2639}.quiet{background:#e8f8ef;color:#16805a}.review{background:#ebe9ff;color:#5d43b8}.report{position:sticky;top:16px;overflow:hidden}.report-head{padding:18px 18px 12px;background:linear-gradient(135deg,#082d63,#106fc5);color:#fff}.report-head p{font-size:.77rem;margin:5px 0 0;color:#cae7ff}.person{display:flex;align-items:center;gap:10px;margin-top:14px}.person img{width:72px;height:88px;object-fit:contain;object-position:bottom;mix-blend-mode:multiply;background:#0d4f9b;border-radius:13px}.person b{display:block}.person span{display:block;margin-top:3px;color:#c4e2ff;font-size:.77rem}.content{padding:18px}.label{font-size:.73rem;font-weight:900;color:#1a67af;letter-spacing:.03em}.signals{display:grid;gap:8px;margin:8px 0 17px}.signal{display:flex;justify-content:space-between;gap:12px;padding:10px;border:1px solid #e2eaf4;border-radius:11px;background:#f9fbfe;font-size:.82rem}.signal b{color:#a4440b}.narrative{margin:8px 0 16px;padding:12px;border-right:3px solid #1976d2;border-radius:0 11px 11px 0;background:#f2f8ff;line-height:1.75;font-size:.84rem;color:#3d536f}.reading{font-size:.77rem;color:#826323;background:#fff9e8;border:1px solid #f2df9c;border-radius:10px;padding:9px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{border:1px solid #cbdced;border-radius:10px;padding:9px 10px;background:#fff;color:#36516f;font-weight:800}.actions .accept{background:#0875d9;border-color:#0875d9;color:#fff}.actions .restore{color:#bb3040}.result{min-height:20px;margin:11px 0 0;font-size:.77rem;color:#177353;font-weight:800}@media(max-width:880px){body{padding:12px}.layout{grid-template-columns:1fr}.report{position:relative;top:0}.top{align-items:flex-start}.time{white-space:nowrap}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><h1>طابور المراقبين اليومي</h1><p>تقارير الساعة 12:00 — الإشارات المقاسة تظهر قبل سرد المراقب.</p></div><div class="time">اليوم · 12:00 ظهراً</div></header>
    <section class="layout">
      <section class="queue"><div class="queue-head"><h2>مراقبو الموظفين</h2><span class="count">45 تقرير اليوم</span></div><nav class="filters"><button class="active">الكل</button><button>تنبيه</button><button>خصم آلي</button><button>هادئ</button><button>مراجعة</button></nav><div class="cards" id="cards"></div></section>
      <aside class="report" aria-live="polite"><header class="report-head"><h2>تقرير اليوم</h2><p>التقرير لا يحل محل الدليل أو قرار المدير.</p><div class="person"><img src="assets/golden-male-3d-v1.png" alt="أفاتار المراقب"><div><b id="monitorName">راشد</b><span id="employeeName">مراقب أحمد سالم · إدارة الكوادر</span></div></div></header><div class="content"><div class="label">الإشارات المقاسة</div><div class="signals" id="signals"></div><div class="label">سرد المراقب</div><p class="narrative" id="narrative"></p><p class="reading" id="reading"></p><div class="actions"><button class="accept" id="accept">اعتماد التقرير</button><button class="restore" id="restore">رجوع النقطة</button></div><p class="result" id="result"></p></div></aside>
    </section>
  </main>
  <script>
    const data=[
      {m:'راشد',e:'أحمد سالم · إدارة الكوادر',i:'رس',tone:'',status:'خصم آلي',kind:'deduct',facts:[['تأخر الحضور','27 دقيقة · 08:57'],['مهمة متأخرة','تحديث ملفات الكوادر · 11:30']],n:'أنا مراقب أحمد في إدارة الكوادر. القاعدة حسبت خصم نقطة واحدة بعد تحذير سابق لم يُغلق ضمن المهلة. الإشارتان أعلاه هما سبب الإجراء.',r:'قراءة المراقب: تكرر التأخر اليوم، لكن لا أملك دليلاً يحدد سببه. سُجل نشاط على المهمة عند 13:10.'},
      {m:'سُهى',e:'مراقبة نور كاظم · المالية',i:'سه',tone:'purple',status:'تنبيه',kind:'warn',facts:[['مهمة قريبة من الموعد','مراجعة السلف · بقي 35 دقيقة'],['الحضور','مسجل في 08:01']],n:'أنا مراقبة نور في المالية. لا يوجد خصم. أرسلت تنبيهاً لأن المهمة ستتجاوز الموعد إن لم تُحدّث قبل 14:00.',r:'قراءة المراقب: هذا تنبيه وقائي مبني على الوقت المتبقي فقط.'},
      {m:'زياد',e:'مراقب علي ناصر · المبيعات',i:'زي',tone:'green',status:'هادئ',kind:'quiet',facts:[['الحضور','مسجل في 07:56'],['المهام المتأخرة','0 مهام']],n:'أنا مراقب علي في المبيعات. لا يوجد إجراء اليوم؛ كل الإشارات المقاسة ضمن الحدود.',r:'لا أستنتج أكثر من ذلك: يوم هادئ لا يعني حكماً دائماً على الأداء.'},
      {m:'لمى',e:'مراقبة مريم خالد · الدعم',i:'لم',tone:'amber',status:'مراجعة',kind:'review',facts:[['بيانات ناقصة','لم تُحدّث حالة المهمة'],['الحضور','مسجل في 08:11']],n:'أنا مراقبة مريم في الدعم. يوجد نقص في تحديث البيانات، لذلك أحتاج مراجعة ولا أنشئ خصماً أو حكماً.',r:'لا توجد إشارة كافية لتفسير سبب النقص أو اقتراح إجراء.'}
    ];
    const cards=document.querySelector('#cards'),monitorName=document.querySelector('#monitorName'),employeeName=document.querySelector('#employeeName'),signals=document.querySelector('#signals'),narrative=document.querySelector('#narrative'),reading=document.querySelector('#reading'),result=document.querySelector('#result');let chosen=0;
    function render(){cards.innerHTML=data.map((x,i)=>`<button class="monitor ${i===chosen?'active':''}" data-i="${i}"><span class="avatar ${x.tone}">${x.i}</span><span class="who"><b>${x.m}</b><span>${x.e}</span><span class="fact">${x.facts[0][0]}: ${x.facts[0][1]}</span></span><span class="badge ${x.kind}">${x.status}</span></button>`).join('');cards.querySelectorAll('.monitor').forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;result.textContent='';render();detail()})}
    function detail(){let x=data[chosen];monitorName.textContent=x.m;employeeName.textContent=x.e;signals.innerHTML=x.facts.map(f=>`<div class="signal"><span>${f[0]}</span><b>${f[1]}</b></div>`).join('');narrative.textContent=x.n;reading.textContent=x.r;document.querySelector('#restore').style.display=x.kind==='deduct'?'inline-block':'none'}
    document.querySelector('#accept').onclick=()=>result.textContent='تم اعتماد التقرير في هذه المعاينة.';document.querySelector('#restore').onclick=()=>result.textContent='طلب رجوع النقطة يحتاج سبباً وتدقيقاً في النظام الحقيقي.';render();detail();
  </script>
</body>
</html>
