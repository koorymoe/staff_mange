# إخفاء إصدار nginx من ترويسة Server وصفحات الخطأ — الإصدار الظاهر
# يعطي المهاجم قائمة الثغرات المعروفة لهذا الإصدار بالضبط.
server_tokens off;

# ── الضغط ──
# nginx يجي بالضغط مطفي افتراضياً، وما جان منشغّل. يعني ملف الجافاسكربت
# جان ينرسل ٣٥٣ كيلوبايت وهو ١٠٢ مضغوط، والستايل ١٣١ وهو ~٢٠.
# كل موظف يفتح النظام أول مرة ينزّل قرابة ٤٨٥ كيلوبايت بدل ١٣٠ —
# ثلاث أضعاف ونص بلا سبب، وعلى شبكة الموبايل يبيّن «بطيء» حتى لو
# السيرفر يرد بأجزاء من الثانية.
gzip on;
gzip_vary on;              # حتى الكاش الوسيط ما يخلط بين نسخة مضغوطة وغير مضغوطة
gzip_comp_level 6;         # توازن معقول بين حجم الملف ووقت المعالجة
gzip_min_length 1024;      # الملف الصغير ضغطه يكلف أكثر ما يوفر
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf;
# ملاحظة: woff2 ما ينضاف — هو أصلاً مضغوط جوّاه، وإعادة ضغطه تكلف
# معالج بلا أي توفير.

server {
    listen 80;
    server_name _;

    # ملفات الفرونت إند الثابتة
    root /usr/share/nginx/html;
    index index.html;

    # ── ترويسات الحماية على صفحات HTML نفسها ──
    # الباك اند يضيفها على ردود الـAPI، بس الصفحة الي يقدّمها nginx جانت
    # بلا أي حماية: يعني ممكن يوضع النظام داخل iframe بموقع خبيث
    # (Clickjacking)، وماكو سياسة محتوى تحدّ من أثر أي XSS مستقبلي.
    # always حتى تنضاف حتى بردود الخطأ.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS: المتصفح ما يرجع يتصل بـhttp أبداً بعد أول زيارة. Caddy هو الي
    # ينهي TLS، بس نضيفها هنا كمان حتى تبقى حتى لو تغيّر الـproxy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: الخط صار محفوظ داخل النظام، فشلنا سماح كوكل (fonts.googleapis
    # و fonts.gstatic) — ما بقى إله داعي، وكل مصدر خارجي نشيله يقلل
    # مساحة الخطر. الصور من data: (مخزونة base64) وخرائط الشوارع بس.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ملفات التطبيق (React Router) — أي مسار غير موجود يرجع index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # تحويل كل طلبات /api لحاوية الباك إند (Go) على نفس شبكة docker
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # كاش أطول لملفات الأصول الثابتة المبنية (JS/CSS مع hash بالاسم)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
