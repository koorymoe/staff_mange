server {
    listen 80;
    server_name _;

    # ملفات الفرونت إند الثابتة
    root /usr/share/nginx/html;
    index index.html;

    # ملفات التطبيق (React Router) — أي مسار غير موجود يرجع index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # تحويل كل طلبات /api لحاوية الباك إند (Go) على نفس شبكة docker
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # كاش أطول لملفات الأصول الثابتة المبنية (JS/CSS مع hash بالاسم)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
