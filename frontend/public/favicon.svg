<!-- أيقونة تبويب المتصفح.
     كانت أيقونة Vite الافتراضية (البرق البنفسجي) — يعني نظام الشركة
     يطلع بتبويبات الموظف بعلامة أداة بناء ما إلها علاقة بينا، والموظف
     الي فاتح عشر تبويبات ما يميّز تبويبنا.

     صارت نفس علامة النظام الي بأعلى القائمة الجانبية: مكعّب أبيض على
     مربّع بتدرّج الأزرق مالتنا (#2c5aad ← #1a3a6e) ونقطة خضرا.
     ⚠️ نفس الشكل بالضبط عن قصد — الموظف يربط الاثنين بلمحة. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c5aad"/>
      <stop offset="1" stop-color="#1a3a6e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 41V23a4 4 0 0 0-2-3.46l-14-8a4 4 0 0 0-4 0l-14 8A4 4 0 0 0 14 23v18a4 4 0 0 0 2 3.46l14 8a4 4 0 0 0 4 0l14-8A4 4 0 0 0 50 41z"/>
