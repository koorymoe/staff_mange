<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>فورما نقل الباك إند إلى Go — شركة الأماني</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #0f2040, #1a3a6e 60%, #2c5aad);
    min-height: 100vh;
    margin: 0;
    padding: 32px 16px;
    color: #0f2040;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header {
    text-align: center;
    color: white;
    margin-bottom: 24px;
  }
  header h1 { font-size: 24px; margin: 0 0 6px; }
  header p { margin: 0; opacity: .8; font-size: 14px; }

  .progress-card {
    background: white;
    border-radius: 18px;
    padding: 20px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    margin-bottom: 20px;
  }
  .progress-bar-bg {
    background: #e8edf5;
    border-radius: 999px;
    height: 16px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #2c5aad, #10b981);
    border-radius: 999px;
    transition: width .4s ease;
  }
  .progress-label { display:flex; justify-content:space-between; align-items:baseline; }
  .progress-label b { font-size: 20px; color: #2c5aad; }

  .list {
    background: white;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    overflow: hidden;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid #f0f4f9;
    cursor: pointer;
    transition: background .15s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: #f8fafc; }
  .item.done { background: #f0fdf4; }

  .checkbox {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 2px solid #cbd5e1;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .item.done .checkbox {
    background: #10b981;
    border-color: #10b981;
  }
  .checkbox svg { display: none; width: 16px; height: 16px; stroke: white; stroke-width: 3; }
  .item.done .checkbox svg { display: block; }

  .item-text { flex: 1; }
  .item-name { font-weight: 700; font-size: 15px; }
  .item.done .item-name { text-decoration: line-through; color: #16a34a; }
  .item-note { font-size: 12px; color: #94a3b8; margin-top: 2px; }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: #fef3c7;
    color: #b45309;
    flex-shrink: 0;
  }
  .item.done .badge { background: #dcfce7; color: #16a34a; }

  footer { text-align: center; color: rgba(255,255,255,.6); font-size: 12px; margin-top: 20px; }
  .reset-btn {
    display: block; margin: 16px auto 0;
    background: rgba(255,255,255,.15); color: white; border: 1px solid rgba(255,255,255,.3);
    padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer;
  }
  .reset-btn:hover { background: rgba(255,255,255,.25); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛠️ فورما نقل الباك إند إلى Go</h1>
    <p>نظام شركة الأماني — تتبع تقدم بناء الباك إند الجديد قسم قسم</p>
  </header>

  <div class="progress-card">
    <div class="progress-label">
      <span>نسبة الإنجاز</span>
      <b id="progressText">0%</b>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  </div>

  <div class="list" id="list"></div>

  <button class="reset-btn" onclick="resetAll()">إعادة تصفير الفورما</button>
  <footer>اضغط على أي قسم لتأشيره كمكتمل — يُحفظ تلقائياً بهذا المتصفح</footer>
</div>

<script>
const items = [
  { key: 'auth', name: 'تسجيل الدخول (auth)', note: 'JWT + bcrypt', done: true },
  { key: 'employees', name: 'إدارة الكوادر (employees)', note: 'عرض / إضافة / تعديل', done: true },
  { key: 'permissions', name: 'الصلاحيات (permissions)', note: 'عرض / تعديل / تطبيق افتراضي', done: true },
  { key: 'services', name: 'الخدمات والمهارات (services)', note: '' },
  { key: 'customers', name: 'العملاء (customers)', note: '' },
  { key: 'bookings', name: 'الحجوزات (bookings)', note: '' },
  { key: 'cart', name: 'سلة الحجز (cart)', note: 'المواد المستخدمة بالحجز' },
  { key: 'expenses', name: 'المصاريف (expenses)', note: '' },
  { key: 'inventory', name: 'جرد الأدوات (inventory)', note: '' },
  { key: 'kpi', name: 'تقييم الأداء اليدوي (kpi)', note: '' },
  { key: 'smart-kpi', name: 'تقييم الأداء التلقائي (smart-kpi)', note: 'الرانك الأسبوعي/الشهري' },
  { key: 'complaints', name: 'الشكاوى (complaints)', note: '' },
  { key: 'training', name: 'التدريب (training)', note: 'ميزة جديدة أضيفت اليوم' },
  { key: 'missions', name: 'تتبع المهام (missions)', note: '' },
  { key: 'projects', name: 'إدارة المشاريع (projects)', note: '' },
  { key: 'procurement', name: 'المشتريات (procurement)', note: '' },
  { key: 'suppliers', name: 'الموردون (suppliers)', note: '' },
  { key: 'quotations', name: 'عروض الأسعار (quotations)', note: '' },
  { key: 'products', name: 'المنتجات (products)', note: '' },
  { key: 'gps', name: 'نظام GPS (gps)', note: 'عملاء / أجهزة / سيمات / تجديدات / صيانة — قسم كبير', big: true },
  { key: 'stats', name: 'الإحصائيات العامة (stats)', note: '' },
];

const STORAGE_KEY = 'staffmange_go_migration_progress';

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return saved;
  } catch { return {}; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function render() {
  const state = loadState();
  const list = document.getElementById('list');
  list.innerHTML = '';

  items.forEach(item => {
    const isDone = state[item.key] !== undefined ? state[item.key] : !!item.done;
    const el = document.createElement('div');
    el.className = 'item' + (isDone ? ' done' : '');
    el.innerHTML = `
      <div class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="item-text">
        <div class="item-name">${item.name}</div>
        ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
      </div>
      <div class="badge">${isDone ? 'مكتمل' : (item.big ? 'قسم كبير' : 'قيد الانتظار')}</div>
    `;
    el.onclick = () => {
      const current = loadState();
      current[item.key] = !isDone;
      saveState(current);
      render();
    };
    list.appendChild(el);
  });

  const doneCount = items.filter(i => (state[i.key] !== undefined ? state[i.key] : !!i.done)).length;
  const pct = Math.round((doneCount / items.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% (' + doneCount + '/' + items.length + ')';
}

function resetAll() {
  if (confirm('متأكد تريد تصفير كل التأشيرات؟')) {
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
}

render();
</script>
</body>
</html>
